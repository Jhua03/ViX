<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="900px" version="1.1" viewBox="0 0 1600 900" width="1600px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="900" width="1600" x="0" y="0" /><text font-family="DejaVu Sans" font-size="34" font-weight="bold" x="60" y="65">ViX250AH / ViX500AH + Pico 2 control architecture</text><g><rect fill="#eef5ff" height="210" rx="12" ry="12" stroke="#333" stroke-width="2" width="330" x="70" y="160" /><text font-family="DejaVu Sans" font-size="22" font-weight="bold" x="88" y="192">Any USB host computer</text><text font-family="DejaVu Sans" font-size="17" x="88" y="222">Raspberry Pi 5, laptop, desktop</text><text font-family="DejaVu Sans" font-size="17" x="88" y="248">Python + pyserial</text><text font-family="DejaVu Sans" font-size="17" x="88" y="274">Two USB connections</text></g><g><rect fill="#fff7df" height="150" rx="12" ry="12" stroke="#333" stroke-width="2" width="300" x="520" y="110" /><text font-family="DejaVu Sans" font-size="22" font-weight="bold" x="538" y="142">USB to RS-232 adapter</text><text font-family="DejaVu Sans" font-size="17" x="538" y="172">True RS-232 levels</text><text font-family="DejaVu Sans" font-size="17" x="538" y="198">DB9 DTE-style adapter</text></g><g><rect fill="#eef7ed" height="300" rx="12" ry="12" stroke="#333" stroke-width="2" width="390" x="970" y="105" /><text font-family="DejaVu Sans" font-size="22" font-weight="bold" x="988" y="137">Parker ViX AH drive</text><text font-family="DejaVu Sans" font-size="17" x="988" y="167">ViX250AH or ViX500AH</text><text font-family="DejaVu Sans" font-size="17" x="988" y="193">X3: RS-232 config/status</text><text font-family="DejaVu Sans" font-size="17" x="988" y="219">X4: STEP/DIR + encoder copy</text><text font-family="DejaVu Sans" font-size="17" x="988" y="245">X1/X2: motor/power/feedback</text></g><g><rect fill="#f6effc" height="240" rx="12" ry="12" stroke="#333" stroke-width="2" width="340" x="480" y="510" /><text font-family="DejaVu Sans" font-size="22" font-weight="bold" x="498" y="542">Raspberry Pi Pico 2</text><text font-family="DejaVu Sans" font-size="17" x="498" y="572">GP2/3: STEP/DIR</text><text font-family="DejaVu Sans" font-size="17" x="498" y="598">GP4/5/6: encoder A/B/Z</text><text font-family="DejaVu Sans" font-size="17" x="498" y="624">GP7/8/9: limits/home</text><text font-family="DejaVu Sans" font-size="17" x="498" y="650">GP10 fault, GP11 enable</text><text font-family="DejaVu Sans" font-size="17" x="498" y="676">GP12 E-stop auxiliary</text></g><g><rect fill="#fff3e9" height="190" rx="12" ry="12" stroke="#333" stroke-width="2" width="390" x="970" y="530" /><text font-family="DejaVu Sans" font-size="22" font-weight="bold" x="988" y="562">X4 interface board</text><text font-family="DejaVu Sans" font-size="17" x="988" y="592">AM26LV31E: STEP/DIR -&gt; RS-422</text><text font-family="DejaVu Sans" font-size="17" x="988" y="618">AM26LV32E: encoder -&gt; 3.3 V</text><text font-family="DejaVu Sans" font-size="17" x="988" y="644">NPN sink: X4-11 energise</text><text font-family="DejaVu Sans" font-size="17" x="988" y="670">10 kΩ fault pull-up</text></g><line stroke="#333" stroke-width="3" x1="400" x2="520" y1="230" y2="185" /><polygon fill="#333" points="520,185 511.30144543750333,195.96973785116435 506.2333161946136,182.4547265367918" /><rect fill="white" height="28" opacity="0.92" width="240" x="340.0" y="189.5" /><text font-family="DejaVu Sans" font-size="16" text-anchor="middle" x="460.0" y="210.5">USB</text><line stroke="#333" stroke-width="3" x1="820" x2="970" y1="185" y2="180" /><polygon fill="#333" points="970,180 958.2506503639846,187.61267253536263 957.7697828247507,173.1866463583462" /><rect fill="white" height="28" opacity="0.92" width="240" x="775.0" y="164.5" /><text font-family="DejaVu Sans" font-size="16" text-anchor="middle" x="895.0" y="185.5">special DB9 cable -&gt; X3</text><line stroke="#333" stroke-width="3" x1="400" x2="480" y1="310" y2="590" /><polygon fill="#333" points="480,590 469.7649869760142,580.4478008605954 483.64366056935916,576.4824655482112" /><rect fill="white" height="28" opacity="0.92" width="240" x="320.0" y="432.0" /><text font-family="DejaVu Sans" font-size="16" text-anchor="middle" x="440.0" y="453.0">USB CDC</text><line stroke="#333" stroke-width="3" x1="820" x2="970" y1="620" y2="620" /><polygon fill="#333" points="970,620 958.0035574528347,627.2170192055005 958.0035574528347,612.7829807944995" /><rect fill="white" height="28" opacity="0.92" width="240" x="775.0" y="602.0" /><text font-family="DejaVu Sans" font-size="16" text-anchor="middle" x="895.0" y="623.0">3.3 V GPIO</text><line stroke="#333" stroke-width="3" x1="1165" x2="1165" y1="530" y2="405" /><polygon fill="#333" points="1165,405 1172.2170192055005,416.99644254716526 1157.7829807944995,416.99644254716526" /><rect fill="white" height="28" opacity="0.92" width="240" x="1045.0" y="449.5" /><text font-family="DejaVu Sans" font-size="16" text-anchor="middle" x="1165.0" y="470.5">differential X4 + fault/enable</text><text font-family="DejaVu Sans" font-size="20" font-weight="bold" x="70" y="830">Motion path: Host -&gt; Pico 2 -&gt; X4 STEP/DIR -&gt; ViX servo</text><text font-family="DejaVu Sans" font-size="20" x="70" y="865">Configuration/status path: Host -&gt; USB-RS232 -&gt; special cable -&gt; X3</text></svg>