<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="720px" version="1.1" viewBox="0 0 1500 720" width="1500px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="720" width="1500" x="0" y="0" /><text font-family="DejaVu Sans" font-size="34" font-weight="bold" x="60" y="60">ViX X3 RS-232 cable (USB adapter to drive)</text><g><rect fill="#eef5ff" height="410" rx="12" ry="12" stroke="#333" stroke-width="2" width="390" x="70" y="150" /><text font-family="DejaVu Sans" font-size="22" font-weight="bold" x="88" y="182">USB-RS232 adapter side</text><text font-family="DejaVu Sans" font-size="17" x="88" y="212">Typical DB9 male adapter</text><text font-family="DejaVu Sans" font-size="17" x="88" y="238">Use a DB9 FEMALE breakout</text><text font-family="DejaVu Sans" font-size="17" x="88" y="264">Pin 2 = RX</text><text font-family="DejaVu Sans" font-size="17" x="88" y="290">Pin 3 = TX</text><text font-family="DejaVu Sans" font-size="17" x="88" y="316">Pin 5 = GND</text><text font-family="DejaVu Sans" font-size="17" x="88" y="342">Other pins: no connection</text></g><g><rect fill="#eef7ed" height="410" rx="12" ry="12" stroke="#333" stroke-width="2" width="390" x="1030" y="150" /><text font-family="DejaVu Sans" font-size="22" font-weight="bold" x="1048" y="182">ViX X3 side</text><text font-family="DejaVu Sans" font-size="17" x="1048" y="212">X3 is a DB9 socket (female)</text><text font-family="DejaVu Sans" font-size="17" x="1048" y="238">Use a DB9 MALE breakout</text><text font-family="DejaVu Sans" font-size="17" x="1048" y="264">Pin 4 = ViX RX</text><text font-family="DejaVu Sans" font-size="17" x="1048" y="290">Pin 5 = ViX TX</text><text font-family="DejaVu Sans" font-size="17" x="1048" y="316">Pin 3 = RS-232 GND</text><text font-family="DejaVu Sans" font-size="17" x="1048" y="342">Do NOT connect X3 pins 2, 8, 9</text></g><line stroke="#333" stroke-width="3" x1="460" x2="1030" y1="300" y2="300" /><rect fill="white" height="30" width="320" x="585" y="282" /><text font-family="DejaVu Sans" font-size="17" text-anchor="middle" x="745" y="304">adapter TX pin 3 -&gt; ViX RX pin 4</text><line stroke="#333" stroke-width="3" x1="460" x2="1030" y1="370" y2="370" /><rect fill="white" height="30" width="320" x="585" y="352" /><text font-family="DejaVu Sans" font-size="17" text-anchor="middle" x="745" y="374">adapter RX pin 2 &lt;- ViX TX pin 5</text><line stroke="#333" stroke-width="3" x1="460" x2="1030" y1="440" y2="440" /><rect fill="white" height="30" width="320" x="585" y="422" /><text font-family="DejaVu Sans" font-size="17" text-anchor="middle" x="745" y="444">adapter GND pin 5 -&gt; ViX GND pin 3</text><text font-family="DejaVu Sans" font-size="22" font-weight="bold" x="520" y="220">This is NOT a straight-through DB9 cable.</text><text font-family="DejaVu Sans" font-size="18" x="495" y="600">Build it with one female and one male DB9 screw-terminal/breakout connector.</text><text font-family="DejaVu Sans" font-size="17" x="315" y="645">If your USB-RS232 adapter uses a different DB9 gender, follow the pin numbers/functions above, not the connector gender.</text></svg>