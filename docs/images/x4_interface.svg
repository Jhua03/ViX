<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="1150px" version="1.1" viewBox="0 0 1800 1150" width="1800px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="1150" width="1800" x="0" y="0" /><text font-family="DejaVu Sans" font-size="34" font-weight="bold" x="55" y="55">Pico 2 &lt;-&gt; ViX X4 low-voltage interface</text><g><rect fill="#f6effc" height="840" rx="12" ry="12" stroke="#333" stroke-width="2" width="300" x="60" y="110" /><text font-family="DejaVu Sans" font-size="22" font-weight="bold" x="78" y="142">Raspberry Pi Pico 2</text><text font-family="DejaVu Sans" font-size="17" x="78" y="172">3V3</text><text font-family="DejaVu Sans" font-size="17" x="78" y="198">GND</text><text font-family="DejaVu Sans" font-size="17" x="78" y="224">GP2 STEP</text><text font-family="DejaVu Sans" font-size="17" x="78" y="250">GP3 DIR</text><text font-family="DejaVu Sans" font-size="17" x="78" y="276">GP4 ENC_A</text><text font-family="DejaVu Sans" font-size="17" x="78" y="302">GP5 ENC_B</text><text font-family="DejaVu Sans" font-size="17" x="78" y="328">GP6 ENC_Z</text><text font-family="DejaVu Sans" font-size="17" x="78" y="354">GP7 LIMIT+</text><text font-family="DejaVu Sans" font-size="17" x="78" y="380">GP8 LIMIT-</text><text font-family="DejaVu Sans" font-size="17" x="78" y="406">GP9 HOME</text><text font-family="DejaVu Sans" font-size="17" x="78" y="432">GP10 VIX_FAULT</text><text font-family="DejaVu Sans" font-size="17" x="78" y="458">GP11 DRIVE_ENABLE</text><text font-family="DejaVu Sans" font-size="17" x="78" y="484">GP12 ESTOP_AUX</text></g><g><rect fill="#fff7df" height="350" rx="12" ry="12" stroke="#333" stroke-width="2" width="350" x="490" y="120" /><text font-family="DejaVu Sans" font-size="22" font-weight="bold" x="508" y="152">U1 - AM26LV31E</text><text font-family="DejaVu Sans" font-size="17" x="508" y="182">VCC pin16 -&gt; 3V3</text><text font-family="DejaVu Sans" font-size="17" x="508" y="208">GND pin8 -&gt; GND</text><text font-family="DejaVu Sans" font-size="17" x="508" y="234">G pin4 -&gt; 3V3</text><text font-family="DejaVu Sans" font-size="17" x="508" y="260">/G pin12 -&gt; GND</text><text font-family="DejaVu Sans" font-size="17" x="508" y="286">1A pin1 &lt;- GP2 STEP</text><text font-family="DejaVu Sans" font-size="17" x="508" y="312">1Y/1Z pins2/3 -&gt; STEP+/-</text><text font-family="DejaVu Sans" font-size="17" x="508" y="338">2A pin7 &lt;- GP3 DIR</text><text font-family="DejaVu Sans" font-size="17" x="508" y="364">2Y/2Z pins6/5 -&gt; DIR+/-</text><text font-family="DejaVu Sans" font-size="17" x="508" y="390">100 nF at VCC</text></g><g><rect fill="#fff7df" height="390" rx="12" ry="12" stroke="#333" stroke-width="2" width="350" x="490" y="530" /><text font-family="DejaVu Sans" font-size="22" font-weight="bold" x="508" y="562">U2 - AM26LV32E</text><text font-family="DejaVu Sans" font-size="17" x="508" y="592">VCC pin16 -&gt; 3V3</text><text font-family="DejaVu Sans" font-size="17" x="508" y="618">GND pin8 -&gt; GND</text><text font-family="DejaVu Sans" font-size="17" x="508" y="644">G pin4 -&gt; 3V3</text><text font-family="DejaVu Sans" font-size="17" x="508" y="670">/G pin12 -&gt; GND</text><text font-family="DejaVu Sans" font-size="17" x="508" y="696">1A/1B pins2/1 &lt;- A+/-</text><text font-family="DejaVu Sans" font-size="17" x="508" y="722">1Y pin3 -&gt; GP4</text><text font-family="DejaVu Sans" font-size="17" x="508" y="748">2A/2B pins6/7 &lt;- B+/-</text><text font-family="DejaVu Sans" font-size="17" x="508" y="774">2Y pin5 -&gt; GP5</text><text font-family="DejaVu Sans" font-size="17" x="508" y="800">3A/3B pins10/9 &lt;- Z+/-</text><text font-family="DejaVu Sans" font-size="17" x="508" y="826">3Y pin11 -&gt; GP6</text><text font-family="DejaVu Sans" font-size="17" x="508" y="852">100 nF at VCC</text></g><g><rect fill="#eef7ed" height="850" rx="12" ry="12" stroke="#333" stroke-width="2" width="390" x="1010" y="105" /><text font-family="DejaVu Sans" font-size="22" font-weight="bold" x="1028" y="137">ViX X4 - HD15 socket</text><text font-family="DejaVu Sans" font-size="17" x="1028" y="167">Pin 12 STEP+ (EI=0)</text><text font-family="DejaVu Sans" font-size="17" x="1028" y="193">Pin 7 STEP-</text><text font-family="DejaVu Sans" font-size="17" x="1028" y="219">Pin 13 DIR+</text><text font-family="DejaVu Sans" font-size="17" x="1028" y="245">Pin 8 DIR-</text><text font-family="DejaVu Sans" font-size="17" x="1028" y="271">Pin 14 A+ out (EO=2)</text><text font-family="DejaVu Sans" font-size="17" x="1028" y="297">Pin 9 A- out</text><text font-family="DejaVu Sans" font-size="17" x="1028" y="323">Pin 15 B+ out</text><text font-family="DejaVu Sans" font-size="17" x="1028" y="349">Pin 10 B- out</text><text font-family="DejaVu Sans" font-size="17" x="1028" y="375">Pin 5 Z+ out</text><text font-family="DejaVu Sans" font-size="17" x="1028" y="401">Pin 4 Z- out</text><text font-family="DejaVu Sans" font-size="17" x="1028" y="427">Pin 6 FAULT open collector</text><text font-family="DejaVu Sans" font-size="17" x="1028" y="453">Pin 11 ENERGISE input</text><text font-family="DejaVu Sans" font-size="17" x="1028" y="479">Pin 3 control 0 V</text></g><line stroke="#333" stroke-width="3" x1="720" x2="1010" y1="280" y2="250" /><text font-family="DejaVu Sans" font-size="16" text-anchor="middle" x="865.0" y="257.0">STEP+/- -&gt; X4 12/7</text><line stroke="#333" stroke-width="3" x1="720" x2="1010" y1="355" y2="330" /><text font-family="DejaVu Sans" font-size="16" text-anchor="middle" x="865.0" y="334.5">DIR+/- -&gt; X4 13/8</text><line stroke="#333" stroke-width="3" x1="1010" x2="840" y1="520" y2="650" /><text font-family="DejaVu Sans" font-size="16" text-anchor="middle" x="925.0" y="577.0">A+/- -&gt; U2 pins 2/1</text><line stroke="#333" stroke-width="3" x1="1010" x2="840" y1="600" y2="735" /><text font-family="DejaVu Sans" font-size="16" text-anchor="middle" x="925.0" y="659.5">B+/- -&gt; U2 pins 6/7</text><line stroke="#333" stroke-width="3" x1="1010" x2="840" y1="680" y2="820" /><text font-family="DejaVu Sans" font-size="16" text-anchor="middle" x="925.0" y="742.0">Z+/- -&gt; U2 pins 10/9</text><g><rect fill="#fff3e9" height="630" rx="12" ry="12" stroke="#333" stroke-width="2" width="285" x="1460" y="150" /><text font-family="DejaVu Sans" font-size="22" font-weight="bold" x="1478" y="182">Single-ended I/O</text><text font-family="DejaVu Sans" font-size="17" x="1478" y="212">FAULT:</text><text font-family="DejaVu Sans" font-size="17" x="1478" y="238">X4-6 -&gt; GP10</text><text font-family="DejaVu Sans" font-size="17" x="1478" y="264">10 kΩ pull-up to 3V3</text><text font-family="DejaVu Sans" font-size="17" x="1478" y="290" /><text font-family="DejaVu Sans" font-size="17" x="1478" y="316">ENERGISE (ES=0):</text><text font-family="DejaVu Sans" font-size="17" x="1478" y="342">X4-11 -&gt; 2N3904 collector</text><text font-family="DejaVu Sans" font-size="17" x="1478" y="368">emitter -&gt; X4-3 / GND</text><text font-family="DejaVu Sans" font-size="17" x="1478" y="394">GP11 -&gt; 4.7 kΩ -&gt; base</text><text font-family="DejaVu Sans" font-size="17" x="1478" y="420">100 kΩ base -&gt; emitter</text><text font-family="DejaVu Sans" font-size="17" x="1478" y="446" /><text font-family="DejaVu Sans" font-size="17" x="1478" y="472">E-stop aux:</text><text font-family="DejaVu Sans" font-size="17" x="1478" y="498">NC contact GP12 -&gt; GND</text><text font-family="DejaVu Sans" font-size="17" x="1478" y="524" /><text font-family="DejaVu Sans" font-size="17" x="1478" y="550">Limits/Home:</text><text font-family="DejaVu Sans" font-size="17" x="1478" y="576">4.7 kΩ pull-ups if</text><text font-family="DejaVu Sans" font-size="17" x="1478" y="602">open-collector sensors</text></g><line stroke="#333" stroke-width="3" x1="1400" x2="1460" y1="790" y2="400" /><line stroke="#333" stroke-width="3" x1="1400" x2="1460" y1="850" y2="520" /><text font-family="DejaVu Sans" font-size="19" font-weight="bold" x="60" y="1010">Connect Pico GND to ViX X4 pin 3 because fault and energise are single-ended.</text><text font-family="DejaVu Sans" font-size="18" x="60" y="1050">Use twisted pairs for STEP+/-, DIR+/-, A+/-, B+/-, Z+/-. Optional 100-120 ohm termination is fitted at the receiving end for long/fast links.</text><text font-family="DejaVu Sans" font-size="18" x="60" y="1090">Do not breadboard X1 motor/HV wiring. X1/X2 remain Parker motor/power/feedback connections.</text></svg>